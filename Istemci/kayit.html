<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChimeVerse - Kayit Ol</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(circle at top right, #0f172a, #020617);
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(16,185,129,0.1) 0%, transparent 50%);
            animation: rotate 25s linear infinite reverse;
            z-index: -1;
        }
        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .kutu {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 50px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 420px;
            text-align: center;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h2 { 
            margin-top: 0; 
            font-size: 28px;
            background: linear-gradient(135deg, #10b981 0%, #34d399 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 30px;
        }
        input {
            width: 100%;
            padding: 16px;
            margin: 12px 0;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 12px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 15px;
            transition: all 0.3s ease;
        }
        input:focus {
            border-color: #10b981;
            background: rgba(15, 23, 42, 0.8);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15);
            outline: none;
        }
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }
        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 20px;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4);
        }
        button:active {
            transform: translateY(1px);
        }
        .hata { color: #ef4444; margin-bottom: 15px; font-size: 14px; font-weight: 500; }
        .basari { color: #10b981; margin-bottom: 15px; font-size: 14px; font-weight: 500; }
        .baglanti {
            display: inline-block;
            margin-top: 25px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }
        .baglanti:hover { color: #f8fafc; }
        .sifre-kutu { position: relative; width: 100%; margin: 12px 0; }
        .sifre-kutu input { width: 100%; margin: 0; padding-right: 40px; }
        .goz-ikonu { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; opacity: 0.7; user-select: none; }
        .goz-ikonu:hover { opacity: 1; }
    </style>
</head>
<body>
    <div class="kutu">
        <h2>Kayit Ol</h2>
        <div id="bilgiMesaji" class=""></div>
        <input type="text" id="kullaniciAdi" placeholder="Kullanici Adi">
        <input type="email" id="eposta" placeholder="E-posta Adresi">
        <input type="date" id="dogumTarihi" title="Dogum Tarihi">
        <div class="sifre-kutu">
            <input type="password" id="sifre" placeholder="Sifre">
            <span class="goz-ikonu" onclick="sifreGoster('sifre')">👁️</span>
        </div>
        <div class="sifre-kutu">
            <input type="password" id="sifreTekrar" placeholder="Sifre (Tekrar)">
            <span class="goz-ikonu" onclick="sifreGoster('sifreTekrar')">👁️</span>
        </div>
        <button onclick="kayitOl()">Kayıt Ol</button>
        <a href="giris.html" class="baglanti">Zaten hesabin var mi? Giris yap</a>
    </div>

    <script src="config.js"></script>
    <script>
        function sifreGoster(id) {
            const el = document.getElementById(id);
            if (el.type === "password") {
                el.type = "text";
            } else {
                el.type = "password";
            }
        }

        async function kayitOl() {
            const kullaniciAdi = document.getElementById('kullaniciAdi').value;
            const eposta = document.getElementById('eposta').value;
            const dogumTarihi = document.getElementById('dogumTarihi').value;
            const sifre = document.getElementById('sifre').value;
            const sifreTekrar = document.getElementById('sifreTekrar').value;
            const bilgiDiv = document.getElementById('bilgiMesaji');

            if(!kullaniciAdi || !eposta || !dogumTarihi || !sifre || !sifreTekrar) {
                bilgiDiv.className = 'hata';
                bilgiDiv.textContent = "Tum alanlari doldurmalisiniz.";
                return;
            }

            if(sifre !== sifreTekrar) {
                bilgiDiv.className = 'hata';
                bilgiDiv.textContent = "Şifreler uyuşmuyor, lütfen kontrol edin.";
                return;
            }

            // Güvenlik: Şifre karmaşıklığı (OWASP)
            if (sifre.length < 6 || !/\d/.test(sifre) || !/[a-zA-Z]/.test(sifre)) {
                bilgiDiv.className = 'hata';
                bilgiDiv.textContent = "Şifreniz en az 6 karakter uzunluğunda olmalı ve hem harf hem de rakam içermelidir.";
                return;
            }

            try {
                const yanit = await fetch(API_URL + '/api/kayit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ kullaniciAdi, eposta, dogumTarihi, sifre })
                });

                const sonuc = await yanit.json();
                
                if(sonuc.basarili) {
                    bilgiDiv.className = 'basari';
                    bilgiDiv.textContent = sonuc.mesaj;
                    setTimeout(() => {
                        window.location.href = sonuc.yonlendir || 'giris.html';
                    }, 2500);
                } else {
                    bilgiDiv.className = 'hata';
                    bilgiDiv.textContent = sonuc.mesaj;
                }
            } catch (hata) {
                bilgiDiv.className = 'hata';
                bilgiDiv.textContent = "Baglanti hatasi olustu.";
            }
        }
    </script>
</body>
</html>
